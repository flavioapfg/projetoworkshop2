<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Story Viewer - Gooday</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            gooday: {
              lime: '#D4E938',
              dark: '#12151A',
            }
          },
          borderRadius: {
            '4xl': '2rem',
          }
        }
      }
    };
  </script>
<!-- Google Fonts Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-layout">
    /* Subtle backdrop blur simulation and story card aspect ratio */
    .story-card-shadow {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    
    .nav-arrow-btn {
      background: rgba(45, 48, 55, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease-in-out;
    }
    
    .nav-arrow-btn:hover {
      background: rgba(65, 70, 80, 0.85);
      transform: scale(1.08);
    }

    .glass-input {
      background: rgba(20, 22, 28, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .glass-reaction-btn {
      background: rgba(26, 29, 36, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .glass-reaction-btn:hover {
      transform: scale(1.22);
      background: rgba(40, 44, 55, 0.85);
    }

    .progress-bar-fill {
      animation: storyProgress 5s linear forwards;
    }

    @keyframes storyProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body class="bg-[#121316] font-sans antialiased text-white min-h-screen w-full flex items-center justify-center p-0 m-0 overflow-hidden select-none">
<!-- BEGIN: StoryModalBackdrop -->
<div class="fixed inset-0 bg-[#0a0c10]/80 backdrop-blur-md flex items-center justify-center z-50" data-purpose="story-modal-overlay">
<!-- Previous Story Navigation Button (Left) -->
<button aria-label="Story anterior" class="nav-arrow-btn hidden sm:flex absolute left-4 md:left-8 lg:left-16 xl:left-24 z-40 w-11 h-11 rounded-full items-center justify-center text-white/80 hover:text-white shadow-lg cursor-pointer" data-purpose="nav-previous" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
<!-- BEGIN: StoryCentralCard -->
<main class="relative w-full max-w-[420px] h-[92vh] max-h-[760px] rounded-[30px] overflow-hidden story-card-shadow flex flex-col justify-between mx-auto" data-purpose="story-container">
<!-- Background Story Image -->
<div class="absolute inset-0 z-0 bg-[#1e232c]">
<!-- Uses provided asset reference -->
<img alt="Júlia Andrade praticando yoga" class="w-full h-full object-cover object-center transform scale-100" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7yc2_fDoZiaBvZmSusxj-lbNdGKv9E8KG34uwGzXTCj8ppWiM5GDX7D6exWvtRSg-8oZsIo1AKOMNsSW8Oh9fttPAQkKsDxWaAwdUgvvjGQkSekPC6TplQcoC8uRJAsYOjirwYC-0HBh-BAFd0brff7PIjytHjKifBc6vI3Dzc1DtlNnm-XIFurrN_AMP292F58SKbt-1MiGD8W23w6r4CGHIhc7wq0qHIAXKIfsOJjrkIOlo5EKnoA"/>
<!-- Top and Bottom Gradient Overlays for Readability -->
<div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/75 pointer-events-none"></div>
</div>
<!-- BEGIN: StoryHeader -->
<header class="relative z-20 px-4 pt-3.5 pb-2" data-purpose="story-header">
<!-- Story Progress Bars -->
<div class="flex items-center gap-1.5 w-full mb-3.5" data-purpose="progress-indicators">
<!-- Segment 1: Completed -->
<div class="h-1 flex-1 bg-white/35 rounded-full overflow-hidden">
<div class="h-full w-full bg-white rounded-full"></div>
</div>
<!-- Segment 2: Active / Current -->
<div class="h-1 flex-1 bg-white/35 rounded-full overflow-hidden">
<div class="h-full bg-white rounded-full progress-bar-fill"></div>
</div>
<!-- Segment 3: Unviewed -->
<div class="h-1 flex-1 bg-white/35 rounded-full overflow-hidden"></div>
<!-- Segment 4: Unviewed -->
<div class="h-1 flex-1 bg-white/35 rounded-full overflow-hidden"></div>
<!-- Segment 5: Unviewed -->
<div class="h-1 flex-1 bg-white/35 rounded-full overflow-hidden"></div>
</div>
<!-- User Profile & Action Bar -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<!-- User Avatar with white border -->
<div class="relative w-10 h-10 rounded-full ring-2 ring-white/90 overflow-hidden shrink-0 shadow-md">
<img alt="Júlia Andrade avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxKjil-mh8Z4SMegZlbPcOR-y5hpggu7tj_C1ZawfgwPB8YUoeWu7jUW3fAU5Do6y1gqZ-taADqL0nvmvFnkAWjT0rsW00AS-2axYY6UH08lz3-2d-VPe1FEEYOtMkPrm-BD5lvCHDKxV0qzEAyMr2tQALiZTB5hsiSFAglALnUd_m2sseIj-98Cj59X4qRbNr3s0AlnUGxA5VjBll45oWwk71AQbVV3AOI7zffA_Zgvq-38t5PqELfw"/>
</div>
<!-- User Meta Info -->
<div class="flex flex-col drop-shadow">
<span class="text-sm font-semibold tracking-wide text-white leading-tight">
                Júlia Andrade
              </span>
<span class="text-xs text-white/75 font-normal">
                há 2 h
              </span>
</div>
</div>
<!-- Close Story Modal Button -->
<button aria-label="Fechar Story" class="w-8 h-8 rounded-full bg-black/40 hover:bg-black/60 backdrop-blur-md text-white/90 hover:text-white flex items-center justify-center transition cursor-pointer" data-purpose="close-button" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
</header>
<!-- END: StoryHeader -->
<!-- Touch tap navigation targets for mobile/quick clicks -->
<div class="relative z-10 flex-1 flex">
<div class="w-1/3 h-full cursor-pointer" title="Voltar Story"></div>
<div class="w-2/3 h-full cursor-pointer" title="Avançar Story"></div>
</div>
<!-- BEGIN: StoryFooterActions -->
<footer class="relative z-20 px-3.5 pb-4 pt-2" data-purpose="story-footer">
<div class="flex items-center gap-2">
<!-- Input Pill Field -->
<div class="relative flex-1 flex items-center">
<input class="glass-input w-full h-11 pl-4 pr-10 text-xs sm:text-sm text-white placeholder-white/60 rounded-full focus:outline-none focus:ring-1 focus:ring-white/50 border-none" placeholder="Responder..." type="text"/>
<!-- Emoji inside input button -->
<button aria-label="Inserir emoji" class="absolute right-3 text-base opacity-80 hover:opacity-100 hover:scale-110 transition shrink-0" type="button">
              😊
            </button>
</div>
<!-- Quick Reaction Buttons -->
<div class="flex items-center gap-1.5 shrink-0">
<!-- Reaction: Heart -->
<button aria-label="Reagir com coração" class="glass-reaction-btn w-9 h-9 rounded-full flex items-center justify-center text-sm shadow-sm active:scale-95" type="button">
              ❤️
            </button>
<!-- Reaction: Clap -->
<button aria-label="Reagir com palmas" class="glass-reaction-btn w-9 h-9 rounded-full flex items-center justify-center text-sm shadow-sm active:scale-95" type="button">
              👏
            </button>
<!-- Reaction: Fire -->
<button aria-label="Reagir com fogo" class="glass-reaction-btn w-9 h-9 rounded-full flex items-center justify-center text-sm shadow-sm active:scale-95" type="button">
              🔥
            </button>
<!-- Reaction: Love Eyes -->
<button aria-label="Reagir com olhos de coração" class="glass-reaction-btn w-9 h-9 rounded-full flex items-center justify-center text-sm shadow-sm active:scale-95" type="button">
              😍
            </button>
</div>
</div>
</footer>
<!-- END: StoryFooterActions -->
</main>
<!-- END: StoryCentralCard -->
<!-- Next Story Navigation Button (Right) -->
<button aria-label="Próximo story" class="nav-arrow-btn hidden sm:flex absolute right-4 md:right-8 lg:right-16 xl:right-24 z-40 w-11 h-11 rounded-full items-center justify-center text-white/80 hover:text-white shadow-lg cursor-pointer" data-purpose="nav-next" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
<!-- END: StoryModalBackdrop -->
<!-- Interactivity Script -->
<script data-purpose="story-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      // Close button handler simulation
      const closeBtn = document.querySelector('[data-purpose="close-button"]');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          console.log('Story viewer closed');
        });
      }

      // Quick reaction click feedback
      const reactions = document.querySelectorAll('.glass-reaction-btn');
      reactions.forEach(btn => {
        btn.addEventListener('click', () => {
          const emoji = btn.innerText.trim();
          console.log(`Reagiu com: ${emoji}`);
        });
      });
    });
  </script>
</body></html>
