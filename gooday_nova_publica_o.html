<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Gooday - Nova Publicação</title>
<!-- Tailwind CSS v3 with forms and container plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              lime: '#dff199',
              limeHover: '#d2ea82',
            },
            modal: {
              dropzone: '#eaedf3',
              border: '#f0f3f8',
              inputBg: '#f8fafc',
            }
          },
          borderRadius: {
            '3xl': '24px',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Style Configurations -->
<style data-purpose="custom-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
<!-- END: Style Configurations -->
</head>
<body class="bg-[#111827] relative w-screen h-screen flex items-center justify-center select-none">
<!-- BEGIN: Background Content (Blurred App Feed Snapshot) -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm" data-purpose="modal-backdrop"></div>
<!-- END: Background Content -->
<!-- BEGIN: Modal Container -->
<div class="relative z-50 w-full max-w-[480px] bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col p-6 animate-fade-in" data-purpose="modal-wrapper" style="border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
<!-- BEGIN: Modal Header -->
<header class="flex items-center justify-between pb-4">
<h2 class="text-[17px] font-bold text-gray-900 tracking-tight">Nova publicação</h2>
<!-- Close Button -->
<button class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 transition-colors flex items-center justify-center text-gray-500 hover:text-gray-800" data-purpose="close-modal-button" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</header>
<!-- END: Modal Header -->
<!-- BEGIN: Media Upload Area -->
<div class="w-full h-[290px] bg-[#eaedf3] hover:bg-[#e4e8ef] transition-colors rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-transparent hover:border-slate-300 group" data-purpose="media-upload-area">
<div class="flex flex-col items-center gap-2.5">
<!-- 4 squares grid icon -->
<svg class="w-7 h-7 text-gray-600 group-hover:scale-105 transition-transform" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="7" rx="1.5" width="7" x="3" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="14"></rect>
<rect height="7" rx="1.5" width="7" x="3" y="14"></rect>
</svg>
<span class="text-xs font-medium text-gray-600 tracking-wide">Tirar foto ou galeria</span>
</div>
</div>
<!-- END: Media Upload Area -->
<!-- BEGIN: Caption Input Section -->
<div class="flex items-center gap-3 py-4" data-purpose="caption-input-container">
<!-- User Avatar -->
<div class="w-9 h-9 rounded-full overflow-hidden flex-shrink-0 bg-slate-200 border border-slate-200">
<svg class="w-full h-full text-slate-400" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
</svg>
</div>
<!-- Textarea / Input -->
<input class="w-full bg-transparent border-none text-[13.5px] text-gray-800 placeholder-gray-400 focus:ring-0 px-0 py-1" placeholder="Escreva uma legenda..." type="text">
</div>
<!-- END: Caption Input Section -->
<!-- BEGIN: Publishing Settings Options -->
<div class="bg-white rounded-xl border border-[#edf1f7] divide-y divide-[#edf1f7] overflow-hidden text-[13px]" data-purpose="publishing-options">
<!-- Option: Marcar pessoas -->
<div class="flex items-center justify-between px-3.5 py-3 hover:bg-slate-50 transition cursor-pointer">
<div class="flex items-center gap-2.5 text-gray-800 font-medium">
<!-- User / Tag Icon -->
<svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span class="">Marcar pessoas</span>
</div>
<div class="flex items-center gap-1.5 text-gray-400">
<span class="text-xs text-gray-500">Adicionar</span>
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Option: Adicionar local -->
<div class="flex items-center justify-between px-3.5 py-3 hover:bg-slate-50 transition cursor-pointer">
<div class="flex items-center gap-2.5 text-gray-800 font-medium">
<!-- Pin Icon -->
<svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span class="">Adicionar local</span>
</div>
<div class="flex items-center gap-1.5 text-gray-400">
<span class="text-xs text-gray-500">Adicionar</span>
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Option: Público -->
<div class="flex items-center justify-between px-3.5 py-3 hover:bg-slate-50 transition cursor-pointer">
<div class="flex items-center gap-2.5 text-gray-800 font-medium">
<!-- Globe Icon -->
<svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10" stroke-width="1.8"></circle>
<path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span class="">Público</span>
</div>
<div class="flex items-center gap-1.5 text-gray-400">
<span class="text-xs text-gray-500">Todos</span>
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Option: Grupo -->
<div class="flex items-center justify-between px-3.5 py-3 hover:bg-slate-50 transition cursor-pointer">
<div class="flex items-center gap-2.5 text-gray-800 font-medium">
<!-- Group / Grid Layout Icon -->
<svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="7" rx="1.5" width="7" x="3" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="14"></rect>
<rect height="7" rx="1.5" width="7" x="3" y="14"></rect>
</svg>
<span class="">Grupo</span>
</div>
<div class="flex items-center gap-1.5 text-gray-400">
<span class="text-xs text-gray-500">Nenhum</span>
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- END: Publishing Settings Options -->
<!-- BEGIN: Modal Footer -->
<footer class="flex items-center justify-between pt-5 mt-auto">
<span class="text-xs text-gray-400 font-normal">0/2.200</span>
<button class="bg-[#dff199] hover:bg-[#d2ea82] transition-colors text-slate-800 text-xs font-semibold px-5 py-2.5 rounded-xl shadow-sm" data-purpose="submit-post-button" type="button">
        Compartilhar
      </button>
</footer>
<!-- END: Modal Footer -->
</div>
<!-- END: Modal Container -->


</body></html>
