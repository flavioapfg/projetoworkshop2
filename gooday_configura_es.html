<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configurações</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#EAEBF3',
              card: '#FFFFFF',
              dark: '#111827',
              gray: '#6B7280',
              lightGray: '#9CA3AF',
              border: '#F1F3F9',
              danger: '#EF4444'
            }
          },
          borderRadius: {
            'custom': '20px'
          }
        }
      }
    };
  </script>
<!-- Custom font styling -->
<style data-purpose="typography">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-[#EAEBF3] text-gray-900 min-h-screen flex flex-col antialiased">
<!-- BEGIN: MainHeader -->
<header class="w-full bg-white h-16 px-8 flex items-center border-b border-transparent shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
<div class="flex items-center gap-4">
<!-- Back button link -->
<a aria-label="Voltar" class="text-gray-900 hover:text-gray-600 transition-colors p-1" href="#">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Page title -->
<h1 class="text-lg font-bold text-gray-900 tracking-tight">Configurações</h1>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 w-full max-w-[560px] mx-auto pt-10 pb-16 px-4 flex flex-col gap-5">
<!-- BEGIN: UserProfileCard -->
<!-- Profile overview card containing avatar, full name, and handle -->
<section class="bg-white rounded-[20px] px-6 py-5 flex items-center gap-4 shadow-sm border border-black/[0.02]" data-purpose="user-profile-card">
<div class="w-14 h-14 rounded-full overflow-hidden flex-shrink-0 bg-gray-100 ring-2 ring-transparent">
<img alt="Avatar de Marcos Vinícius" class="w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOzn3Hb6h6fNwsaAk3b2HZF3EL90lGlb_N5gWfa68VhiauZ0B5tPtISQpU4YxBGagocBQC4akPKua0ifqsHIxiRq1T5reJGaiWjUxs4C1LFsT2JCt6nn4vaMPtcGOuCt3nN_WIdWTCLZrIrHQ1nsjw7ykgL-NIb-NhRp42Rz_Rmmzx0xFqcKTfl9QWYhrca-MCGJNUWFcfE5vgrkRk_yF1efKnNObR32gAKqDL2QRE0XSRt5nTph-Nmw"/>
</div>
<div class="flex flex-col">
<h2 class="text-base font-bold text-gray-900 leading-snug">Marcos Vinícius</h2>
<span class="text-sm text-gray-500 font-normal">@marcos_v</span>
</div>
</section>
<!-- END: UserProfileCard -->
<!-- BEGIN: AccountSettingsCard -->
<!-- Grouped account options for email and password management -->
<section class="bg-white rounded-[20px] shadow-sm border border-black/[0.02] overflow-hidden flex flex-col" data-purpose="account-settings">
<!-- Option: Alterar e-mail -->
<a class="px-6 py-4 flex items-center justify-between hover:bg-gray-50/60 transition-colors group" href="#">
<div class="flex flex-col">
<span class="text-sm font-semibold text-gray-900 group-hover:text-black">Alterar e-mail</span>
<span class="text-xs text-gray-500 mt-0.5">marcos.v@email.com</span>
</div>
<div class="text-gray-400 group-hover:text-gray-600 transition-colors">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</a>
<!-- Subtle inner divider -->
<div class="h-[1px] bg-[#F1F3F9] mx-6"></div>
<!-- Option: Alterar senha -->
<a class="px-6 py-4 flex items-center justify-between hover:bg-gray-50/60 transition-colors group" href="#">
<div class="flex flex-col">
<span class="text-sm font-semibold text-gray-900 group-hover:text-black">Alterar senha</span>
<span class="text-xs text-gray-500 mt-0.5 tracking-widest font-mono">••••••••</span>
</div>
<div class="text-gray-400 group-hover:text-gray-600 transition-colors">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</a>
</section>
<!-- END: AccountSettingsCard -->
<!-- BEGIN: LogoutCard -->
<!-- Standalone destructive action card -->
<section data-purpose="logout-section">
<button class="w-full bg-white rounded-[20px] px-6 py-4 shadow-sm border border-black/[0.02] text-left hover:bg-red-50/40 transition-colors" type="button">
<span class="text-sm font-medium text-[#F43F5E] hover:text-[#E11D48] transition-colors">
          Sair da conta
        </span>
</button>
</section>
<!-- END: LogoutCard -->
</main>
<!-- END: MainContent -->
</body></html>
